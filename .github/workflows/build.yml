name: Compilar APK

# Se ejecuta solo cada vez que cambia el código, y también a mano desde la pestaña "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en la versión "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar el APK
        run: sh build-ci.sh

      - name: Guardar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncher-APK
          path: build/CarLauncher.apk
          if-no-files-found: error

      # Enlace directo y fijo al APK:
      # https://github.com/dallinacv2/CleanLauncher/releases/download/latest/CarLauncher.apk
      - name: Publicar el APK en la versión "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Última versión" --notes "APK más reciente de Clean Launcher." --target "${{ github.sha }}"
          gh release upload latest build/CarLauncher.apk --clobber
